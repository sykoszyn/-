<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- App instalable (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parejo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Parejo" />
    <meta property="og:title" content="Parejo — cuentas claras en pareja" />
    <meta property="og:description" content="Gastos compartidos, cuotas, fijos del mes y metas en pareja. Del “después te paso” al “estamos parejos”." />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #f5f4fa;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0e0d16;
        }
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // El aviso de "instalar" puede llegar antes de que cargue la app: lo guardamos.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__parejoInstallPrompt = e;
        window.dispatchEvent(new Event('parejo-installable'));
      });
      // Service worker solo en el build de producción (no en el servidor de desarrollo).
      window.addEventListener('load', function () {
        if ('serviceWorker' in navigator && document.querySelector('script[src*="/_expo/static/"]')) {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        }
      });
    </script>
  </head>

  <body>
    <noscript>Parejo necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
